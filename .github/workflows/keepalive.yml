# Render 免費方案閒置約 15 分鐘會休眠，休眠時第一則 LINE 訊息會在喚醒過程中遺失。
# 與 cron-job.org 並行，作為第二道保活（GitHub 排程可能延遲數分鐘，僅作補強）。
name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://hansha-linebot.onrender.com/health; then exit 0; fi
            sleep 10
          done
          exit 1
